[MAIN]
SaveDir = saves            // save + profile folder, relative to the game folder or a full path; empty = Steam Cloud as normal
ImportSteamSaves = 1       // 1 = on first run, copy your Steam Cloud saves in (the Steam copies are never changed)
BlockAchievements = 0      // 1 = achievements and Steam stats never unlock (for testing)

[DEBUG]
Log = 0                    // 1 = write DISaveRedirect.log (every save file read/write)
